name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152307755035:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-082f408731d904600" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/voxplain",
              "git pull origin main",
              "cd client && npm install && npm run build",
              "cd ../server && npm install && npm run build && sudo systemctl restart voxplain-server",
              "cd ../ml && source venv/bin/activate && pip install -r requirements.txt && sudo systemctl restart voxplain-ml"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-082f408731d904600" \
            --delay 15 \
            --max-attempts 40

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-082f408731d904600"
