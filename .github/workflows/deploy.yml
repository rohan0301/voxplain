name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152307755035:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-082f408731d904600" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "cd /home/ubuntu/voxplain",
              "git config --global --add safe.directory /home/ubuntu/voxplain",
              "git pull origin main",
              "cd client && npm install && npm run build",
              "cd ../server && npm install && npm run build && sudo systemctl restart voxplain-server",
              "cd ../ml && . venv/bin/activate && pip install -r requirements.txt && sudo systemctl restart voxplain-ml"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 40); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-082f408731d904600" \
              --query "Status" --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-082f408731d904600"

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
